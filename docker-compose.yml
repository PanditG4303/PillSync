services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pillsync
      POSTGRES_USER: pillsync
      POSTGRES_PASSWORD: pillsync
    volumes:
      - pillsync_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillsync -d pillsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://pillsync:pillsync@db:5432/pillsync
      FRONTEND_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-before-deploy}
      APP_TIMEZONE: Asia/Kolkata
      JWT_EXPIRE_HOURS: "24"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy


  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pillsync_pg:
